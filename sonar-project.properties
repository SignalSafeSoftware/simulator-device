sonar.organization=signalsafesoftware
sonar.projectKey=SignalSafeSoftware_simulator-device
sonar.sourceEncoding=UTF-8

sonar.sources=src,examples,gallery,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/gallery-dist/**,**/coverage/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/gallery-dist/**,**/coverage/**

# Coverage is enforced on the published package source only.
sonar.coverage.exclusions=examples/**,gallery/**,scripts/**

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.tests.json,tsconfig.gallery.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
