name: CI

on:
    push:
        branches: [main, develop]
        tags: ["v*"]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

env:
    PUBLISH_NODE_VERSION: "24"
    YARN_ENABLE_SCRIPTS: "false"

jobs:
    checks:
        name: Checks (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Lint
              run: yarn lint

            - name: Typecheck
              run: yarn typecheck

            - name: Build and validate gallery
              run: yarn build && yarn check:gallery && yarn build:gallery

    tests:
        name: Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Test with coverage
              run: yarn test:coverage

    smoke-package:
        name: Smoke package (Node ${{ matrix.node-version }})
        needs: [checks, tests]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Build gallery for packed artifact
              run: yarn check:gallery && yarn build:gallery

            - name: Smoke-test packed artifact
              run: yarn smoke:package

    runtime-compatibility:
        name: Packed runtime (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["19.0.0", "19", "20", "21", "22", "23", "24"]
        steps:
            - uses: actions/checkout@v7
              with:
                  path: package
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - name: Build runtime artifacts
              run: |
                  corepack enable
                  mkdir -p "$RUNNER_TEMP/runtime-artifacts"
                  for directory in package; do
                    (cd "$directory" && yarn install --frozen-lockfile --ignore-scripts && yarn build && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/runtime-artifacts")
                  done
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Test isolated packed consumer
              run: |
                  mkdir -p "$RUNNER_TEMP/runtime-consumer"
                  cp package/tests/runtime-compatibility.mjs "$RUNNER_TEMP/runtime-consumer/"
                  cd "$RUNNER_TEMP/runtime-consumer"
                  npm init -y
                  npm install --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/runtime-artifacts/*.tgz react@18.3.1 react-dom@18.3.1
                  node runtime-compatibility.mjs

    publish:
        name: Publish
        needs: [checks, tests, smoke-package, runtime-compatibility]
        if: |
            startsWith(github.ref, 'refs/tags/v') &&
            needs.checks.result == 'success' &&
            needs.tests.result == 'success' &&
            needs.smoke-package.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.PUBLISH_NODE_VERSION }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Build gallery for publication
              run: yarn check:gallery && yarn build:gallery

            - name: Verify artifact before publish
              run: yarn smoke:package

            - name: Verify release tag matches package version
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
                  assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Release tag must match package.json version');
                  console.log(pkg.name, pkg.version, process.env.GITHUB_REF);
                  NODE

            - name: Configure npm auth
              run: |
                echo "registry=https://registry.npmjs.org/" > ~/.npmrc
                echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to npm
              run: npm publish --access public --ignore-scripts
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
