name: Simulator demo

on:
    pull_request:
        paths:
            - 'docs/examples/local-apps/**'
            - '.github/workflows/demo-pages.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: simulator-demo-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: docs/examples/local-apps
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: docs/examples/local-apps/package-lock.json
            - run: npm ci --engine-strict
            - run: npx playwright install --with-deps chromium
            - name: Check types, build and test the production demo
              run: npm run test:browser
            - name: Upload demo
              if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: docs/examples/local-apps/dist

    deploy:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
